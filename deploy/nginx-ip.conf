limit_req_zone $binary_remote_addr zone=starpost_register:1m rate=5r/m;

server {
    listen 443 ssl;
    server_name __STARPOST_IP__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__STARPOST_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__STARPOST_IP__/privkey.pem;
    client_max_body_size 2m;

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
    }

    location = /rpc {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 40s;
    }

    location = /register {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
        limit_req zone=starpost_register burst=5 nodelay;
    }

    location = /login {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
        limit_req zone=starpost_register burst=5 nodelay;
    }

    location = /credential/claim {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
    }

    location = /mobile/login {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        limit_req zone=starpost_register burst=5 nodelay;
    }

    location = /mobile/rpc {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 40s;
    }

    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
    }

    location / { return 404; }
}
