limit_req_zone $binary_remote_addr zone=starpost_register:1m rate=5r/m;

server {
    listen 443 ssl;
    server_name __STARPOST_IP__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__STARPOST_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__STARPOST_IP__/privkey.pem;
    client_max_body_size 2m;

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
    }

    location = /rpc {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 40s;
    }

    location = /register {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
        limit_req zone=starpost_register burst=5 nodelay;
    }

    location = /login {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
        limit_req zone=starpost_register burst=5 nodelay;
    }

    location = /credential/claim {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
    }

    location = /mobile/login {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        limit_req zone=starpost_register burst=5 nodelay;
    }

    location = /mobile/rpc {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 40s;
    }

    location = /web/login {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=starpost_register burst=5 nodelay;
    }

    location = /web/rpc {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
    }

    location / {
        root /opt/starpost/web;
        # npm tarballs use fixed mtimes; always revalidate HTML/assets by ETag.
        if_modified_since off;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /owner/control {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
    }

    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 20s;
    }

}
